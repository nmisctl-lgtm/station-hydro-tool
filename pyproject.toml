[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "station-hydro-tool"
version = "0.1.0"
description = "A local-first USGS station discovery, analysis, and visualization tool."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "geopandas>=1.0",
    "fastapi>=0.115",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=16",
    "pygeohydro>=0.19.4",
    "pynhd>=0.18",
    "requests-cache>=1.2",
    "scipy>=1.12",
    "shapely>=2.0",
    "uvicorn[standard]>=0.30",
    "xarray>=2024.1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
station-hydro = "station_hydro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/station_hydro"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "station_hydro/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
